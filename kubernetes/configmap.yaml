apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-api-config
  namespace: healthcare-rag
  labels:
    app: rag-api
    app.kubernetes.io/name: rag-healthcare-assistant
    app.kubernetes.io/component: config
data:
  # ── Application ─────────────────────────────────────────────────────────────
  NODE_ENV: "production"
  PORT: "3000"
  API_VERSION: "v1"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  POSTGRES_HOST: "postgres-headless.healthcare-rag.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ragdb"
  POSTGRES_USER: "raguser"

  # ── Redis ────────────────────────────────────────────────────────────────────
  REDIS_HOST: "redis-headless.healthcare-rag.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis-headless.healthcare-rag.svc.cluster.local:6379"

  # ── Pinecone ─────────────────────────────────────────────────────────────────
  PINECONE_ENVIRONMENT: "us-east1-gcp"
  PINECONE_INDEX_NAME: "healthcare-knowledge"

  # ── LLM settings ─────────────────────────────────────────────────────────────
  LLM_PROVIDER: "openai"
  EMBEDDING_PROVIDER: "openai"
  OPENAI_LLM_MODEL: "gpt-4"
  OPENAI_EMBEDDING_MODEL: "text-embedding-ada-002"
  ANTHROPIC_MODEL: "claude-3-5-sonnet-20241022"

  # ── JWT settings ─────────────────────────────────────────────────────────────
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"

  # ── RAG pipeline tuning ───────────────────────────────────────────────────────
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "200"
  MAX_RETRIEVAL_DOCS: "5"
  SIMILARITY_THRESHOLD: "0.75"
  MAX_DOCUMENT_SIZE_MB: "50"

  # ── Rate limiting ─────────────────────────────────────────────────────────────
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"

  # ── Monitoring ────────────────────────────────────────────────────────────────
  ENABLE_METRICS: "true"
  ELASTICSEARCH_URL: "http://elasticsearch.healthcare-rag.svc.cluster.local:9200"

  # ── CORS ──────────────────────────────────────────────────────────────────────
  ALLOWED_ORIGINS: "https://healthcare.example.com,https://admin.healthcare.example.com"
