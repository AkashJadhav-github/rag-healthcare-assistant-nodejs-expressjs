input {
  tcp {
    port => 5000
    codec => json_lines
  }
  beats {
    port => 5044
  }
}

filter {
  if [service] == "rag-healthcare-assistant" {
    mutate {
      add_field => { "[@metadata][index]" => "rag-healthcare-%{+YYYY.MM.dd}" }
    }
    if [level] == "error" or [level] == "ERROR" {
      mutate { add_tag => ["error"] }
    }
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
  stdout { codec => rubydebug }
}
